<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>College Sound Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>COLLEGE SOUND MANAGER</h1>
  <span id="status" class="chip">Stopped</span>
  <button id="stopAll" class="panic">STOP ALL AUDIO</button>
</header>

<main>
  <section class="glass">
    <div class="bar">
      <h2>Programme soundboard</h2>
      <label class="chk"><input type="checkbox" id="editToggle"> Edit board</label>
      <button id="addBtn">+ New button</button>
    </div>
    <div id="board"></div>
  </section>

  <section class="glass">
    <div class="bar"><h2>Music library</h2></div>
    <div class="add">
      <label class="btn">Upload songs<input type="file" id="files" accept="audio/*" multiple hidden></label>
      <input id="ytUrl" placeholder="YouTube link">
      <input id="ytTitle" placeholder="Title (optional)">
      <button id="ytAdd">Add YouTube</button>
    </div>
    <div class="add">
      <input id="q" placeholder="Search songs">
      <select id="catF"></select>
    </div>
    <div id="list"></div>
  </section>
</main>

<footer id="player" class="glass">
  <div class="now"><b id="tt">Nothing playing</b><small id="ts">Pick a song or a soundboard button</small></div>
  <canvas id="viz" height="48"></canvas>
  <div class="seekrow"><span id="tc">–:––</span><input type="range" id="seek" min="0" max="1000" value="0"><span id="td">–:––</span></div>
  <div class="ctl">
    <button id="shuf" title="Shuffle">🔀</button>
    <button id="prev" title="Previous">⏮</button>
    <button id="pp" class="big" title="Play / Pause">▶</button>
    <button id="stop" title="Stop with fade out">⏹</button>
    <button id="nxt" title="Next">⏭</button>
    <button id="rep" title="Repeat">🔁 Off</button>
    <button id="mute" title="Mute">🔊</button>
    <input type="range" id="vol" min="0" max="1" step="0.01">
    <label>Fade <input type="number" id="fade" min="0" max="10" step="0.5"> sec</label>
    <label class="chk"><input type="checkbox" id="xf"> Crossfade</label>
  </div>
</footer>

<div id="ytbox"><div id="yt"></div></div>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
